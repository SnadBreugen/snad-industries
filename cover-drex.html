<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DREX-LP promo banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --board:#0a3fa8; --board2:#1052d6; --screw:#1a4db0; --sig:#ffd400; --ink:#e8eeff; --dim:#9fb4e8; --live:#6bff8c; --line:#2a5bc0; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--ink);font-family:"Space Mono",monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}

  .banner{position:relative;width:1200px;height:630px;overflow:hidden;background:#060c1a;
    background-image:radial-gradient(120% 90% at 80% 50%,rgba(16,82,214,.30),transparent 55%);}
  .banner::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.4;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}

  .inner{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:stretch;padding:54px 46px}
  .kicker{align-self:flex-start;display:flex;align-items:center;gap:14px;margin:0 0 18px 4px}
  .kicker .wave{height:26px;width:auto;color:var(--sig);display:block;filter:drop-shadow(0 0 8px rgba(255,212,0,.5))}
  .kicker .by{font-size:22px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--dim)}
  .word{display:block;width:100%;height:auto;filter:drop-shadow(0 0 34px rgba(255,212,0,.45))}
  .word text{font-family:"Anton",sans-serif;fill:var(--sig)}
  .tag{align-self:flex-start;text-align:left;margin:16px 0 0 4px;max-width:640px;font-size:22px;line-height:1.55;color:#cfe0ff}
  .tag b{color:var(--ink);font-weight:700}

  .rig{position:absolute;right:34px;top:50%;transform:translateY(-50%);z-index:2;width:660px;height:auto;
    filter:drop-shadow(0 0 30px rgba(16,82,214,.4));animation:bob 4.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-50%)}50%{transform:translateY(-53%)}}
  .rig svg{width:100%;height:100%}
  .prog{stroke-dasharray:252;stroke-dashoffset:252;animation:loop 4s linear infinite}
  .prog.t2{animation-delay:1.3s}.prog.t3{animation-delay:2.6s}
  @keyframes loop{from{stroke-dashoffset:252}to{stroke-dashoffset:0}}
  .led{animation:blink 1.4s steps(2,end) infinite}
  @keyframes blink{50%{opacity:.25}}

  .ticker{position:absolute;left:0;right:0;bottom:0;z-index:5;height:54px;background:var(--sig);overflow:hidden;display:flex;align-items:center;border-top:3px solid #060c1a}
  .tk{display:flex;white-space:nowrap;animation:scroll 22s linear infinite}
  .tk span{font-family:"Space Mono",monospace;font-weight:700;font-size:17px;letter-spacing:2px;color:#08183a;padding:0 22px}
  .tk span b{color:#0a3fa8}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
<script>(function(){var F=true,q=[];var R=window.requestAnimationFrame.bind(window),I=window.setInterval.bind(window),T=window.setTimeout.bind(window);window.requestAnimationFrame=function(c){if(F){q.push([0,c]);return 0}return R(c)};window.setTimeout=function(c,d){var a=[].slice.call(arguments,2);if(F){q.push([1,c,d,a]);return 0}return T.apply(null,[c,d].concat(a))};window.setInterval=function(c,d){var a=[].slice.call(arguments,2);if(F){q.push([2,c,d,a]);return 0}return I.apply(null,[c,d].concat(a))};function rel(){if(!F)return;F=false;var s=document.getElementById('__fz');if(s)s.remove();try{document.documentElement.classList.remove('snadfrozen')}catch(e){}window.requestAnimationFrame=R;window.setTimeout=function(c,d){var a=[].slice.call(arguments,2);return T.apply(null,[c,d].concat(a))};window.setInterval=function(c,d){var a=[].slice.call(arguments,2);return I.apply(null,[c,d].concat(a))};q.forEach(function(it){if(it[0]===0)R(it[1]);else if(it[0]===1)T.apply(null,[it[1],it[2]].concat(it[3]));else I.apply(null,[it[1],it[2]].concat(it[3]))});q=[]}window.__snadRelease=rel;window.addEventListener('message',function(e){if(e&&e.data==='snad:play')rel()},false);try{var st=document.createElement('style');st.id='__fz';st.textContent='.snadfrozen *{animation-play-state:paused!important;transition:none!important}';document.documentElement.appendChild(st);document.documentElement.classList.add('snadfrozen')}catch(e){}if(window.top===window.self||location.hash==='#play'){T(rel,60)}})();</script>
</head>
<body>
  <div class="banner">
    <div class="inner">
      <div class="kicker"><svg class="wave" viewBox="0 0 18 13" aria-hidden="true"><g fill="currentColor"><rect x="0" y="5" width="2" height="3"/><rect x="4" y="3" width="2" height="7"/><rect x="8" y="1" width="2" height="11"/><rect x="12" y="4" width="2" height="5"/><rect x="16" y="2" width="2" height="9"/></g></svg><span class="by">SNAD INDUSTRIES</span></div>
      <svg class="word" viewBox="0 0 1000 170" preserveAspectRatio="xMidYMid meet" aria-label="DREX-LP 050" style="overflow:visible">
        <text x="2" y="132" textLength="996" lengthAdjust="spacingAndGlyphs" font-size="150">DREX-LP 050</text>
      </svg>
      <div class="tag">A <b>LOOP MACHINE</b>. Record a part, then stack and overdub track after track into one living loop.</div>
    </div>

    <div class="ticker"><div class="tk" id="tk"></div></div>
  </div>
<script>
  const tk=document.getElementById("tk");
  let row=""; for(let i=0;i<8;i++) row+=`<span>COMING SOON <b>&middot;</b></span>`;
  tk.innerHTML=row+row;
</script>
</body>
</html>
