<style>

  .wrap{max-width:1240px;margin:0 auto;padding:clamp(20px,4vw,48px);position:relative;z-index:3}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:14px;flex-wrap:wrap;gap:12px}
  .brand{font-family:'VT323',monospace;font-size:clamp(28px,5vw,46px);line-height:.9;letter-spacing:1px;color:var(--ink);text-decoration:none}
  .brand span{color:var(--cyan)}
  .back{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);text-decoration:none;border:1px solid var(--line);padding:8px 14px;border-radius:6px;transition:all .2s}

    <div class="foot">THE SIGNAL CONTINUES ///</div>
  </div>

<script>
  const CX=600, CY=410, RX=452, RY=312;
  const devices=[
    {name:"snampler", kind:"sample rig", c:"#E8743A", url:"https://snadbreugen.github.io/snampler/",
     flows:[{d:"in",t:"WAV + MIDI from timeline"},{d:"out",t:"export to timeline"}]},
    {name:"the drecksler", kind:"vocal workbench", c:"#C5291C", url:"https://snadbreugen.github.io/the-drecksler/",
     flows:[{d:"in",t:"WAV + vocoder carrier"},{d:"out",t:"transmit WAV"}]},
    {name:"tonefall", kind:"music game", c:"#FFB228", url:"https://snadbreugen.github.io/tonefall-audiotool/",
     flows:[{d:"out",t:"send loop · MIDI / audio"}]},
    {name:"matrix evolutions", kind:"arpeggiator", c:"#E0249A", url:"https://snadbreugen.github.io/Matrix-Evolutions/",
     flows:[{d:"in",t:"sample / carrier"},{d:"out",t:"render arpeggio"}]},
    {name:"the color guy", kind:"recolor tool", c:"#2BDBE2", url:"https://snadbreugen.github.io/colorizateur/",
     flows:[{d:"in",t:"read project"},{d:"out",t:"write colors"}]},
    {name:"pack midi", kind:"midi export", c:"#F08020", url:"https://snadbreugen.github.io/pack-midi/",
     flows:[{d:"in",t:"read note tracks"},{d:"out",t:"export .mid file"}]},
    {name:"at vault", kind:"backup / transfer", c:"#BFFF01", url:"https://snadbreugen.github.io/at-vault/",
     flows:[{d:"in",t:"back up project"},{d:"out",t:"restore to studio"}]},
    {name:"DREX-LP", kind:"loop machine", c:"#ffd400", soon:true,
     flows:[{d:"out",t:"render tracks to library"}]}
  ];
  const angles=[-90,-45,0,45,90,135,180,225];
  const NS="http://www.w3.org/2000/svg";
  const linksG=document.getElementById("links"), nodesG=document.getElementById("nodes");
  const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};

  devices.forEach((dv,i)=>{
    const a=angles[i]*Math.PI/180;
    const nx=CX+RX*Math.cos(a), ny=CY+RY*Math.sin(a);
    const ux=Math.cos(a), uy=Math.sin(a);
    const sx=CX+ux*150, sy=CY+uy*128;       // start near hub
    const ex=nx-ux*96, ey=ny-uy*40;          // end near node
    const hasOut=dv.flows.some(f=>f.d==="out"), hasIn=dv.flows.some(f=>f.d==="in");
    // connector
    const ln=el("line",{x1:sx,y1:sy,x2:ex,y2:ey,stroke:dv.c,"stroke-width":2,opacity:dv.soon?.5:.85});
    if(dv.soon) ln.setAttribute("stroke-dasharray","7 7");
    linksG.appendChild(ln);
    // arrowheads
    const head=(px,py,dirx,diry)=>{
      const ang=Math.atan2(diry,dirx), s=9;
      const p1x=px-s*Math.cos(ang-0.4), p1y=py-s*Math.sin(ang-0.4);
      const p2x=px-s*Math.cos(ang+0.4), p2y=py-s*Math.sin(ang+0.4);
      linksG.appendChild(el("polygon",{points:`${px},${py} ${p1x},${p1y} ${p2x},${p2y}`,fill:dv.c,opacity:dv.soon?.6:1}));
    };
    if(hasOut) head(sx,sy,-ux,-uy);          // toward hub
    if(hasIn)  head(ex,ey, ux, uy);          // toward device
    // node box
    const w=176,h=52;
    const g=el("g",{});
    const rect=el("rect",{x:nx-w/2,y:ny-h/2,width:w,height:h,rx:8,fill:"rgba(12,12,11,.92)",stroke:dv.c,"stroke-width":dv.soon?1.5:2});
    if(dv.soon) rect.setAttribute("stroke-dasharray","6 5");
    g.appendChild(rect);
    const nm=el("text",{x:nx,y:ny-2,"text-anchor":"middle","font-size":22,fill:dv.c,class:"dname","letter-spacing":1});
    nm.textContent=dv.name.toUpperCase();
    g.appendChild(nm);
    const kd=el("text",{x:nx,y:ny+15,"text-anchor":"middle","font-size":9,fill:"#8d8b82","letter-spacing":2});
    kd.textContent=dv.soon?"LOOP MACHINE · COMING SOON":dv.kind.toUpperCase();
    g.appendChild(kd);
    if(dv.url){
      const link=el("a",{}); link.setAttributeNS("http://www.w3.org/1999/xlink","href",dv.url); link.setAttribute("href",dv.url); link.setAttribute("target","_blank"); link.setAttribute("rel","noopener");
      link.appendChild(g); nodesG.appendChild(link);
    } else { nodesG.appendChild(g); }
    // flow labels (outside the node, away from hub)
    const lx=nx+ux*16, ly=ny+uy*(h/2+16);
    const anchor = ux>0.3?"start":(ux<-0.3?"end":"middle");
    const tx = anchor==="start"? nx+w/2+8 : anchor==="end"? nx-w/2-8 : nx;
    let ty = ny + (uy>=0? h/2+18 : -h/2-8 - (dv.flows.length-1)*15);
    dv.flows.forEach((f,j)=>{
      const arrow=f.d==="in"?"\u2190":"\u2192";
      const t=el("text",{x:tx,y:ty+j*15,"text-anchor":anchor,"font-size":11,fill:dv.soon?"#ffd400":"#cfcdc4","letter-spacing":.5,opacity:dv.soon?.8:1});
      t.textContent=`${arrow} ${f.t}`;
      nodesG.appendChild(t);
    });
  });
</script>
