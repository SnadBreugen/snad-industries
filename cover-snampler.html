<style>
  :root{ --bg:#0c0b0a; --orange:#E8743A; --ink:#ece7db; --dim:#8d8578; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#000;color:var(--ink);font-family:"Space Mono",monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}

  .banner{position:relative;width:1200px;height:630px;overflow:hidden;background:#0c0b0a;
    background-image:radial-gradient(120% 90% at 80% 50%,rgba(232,116,58,.12),transparent 55%);}
  .banner::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.4;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}

  .inner{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;justify-content:center;padding:64px 70px;max-width:560px}
  .kicker{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .kicker .bars{display:flex;align-items:flex-end;gap:3px;height:24px}
  .kicker .bars i{width:4px;background:var(--orange);display:block;border-radius:1px;box-shadow:0 0 8px rgba(232,116,58,.5)}
  .kicker .by{font-size:13px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--dim)}
  .word{font-family:"Anton",sans-serif;font-weight:400;line-height:.92;font-size:82px;letter-spacing:1px;color:var(--orange);text-shadow:0 0 32px rgba(232,116,58,.4)}
  .tag{margin-top:22px;max-width:500px;font-size:21px;line-height:1.5;color:#d9d3c8}
  .tag b{color:var(--ink);font-weight:700}

  .rig{position:absolute;right:70px;top:50%;transform:translateY(-50%);z-index:2;width:380px;
    filter:drop-shadow(0 0 26px rgba(232,116,58,.25));animation:bob 4.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-50%)}50%{transform:translateY(-53%)}}
  .rig svg{width:100%;height:auto;display:block}
  .mk{animation:scan 4s linear infinite}
  @keyframes scan{0%{transform:translateX(0)}100%{transform:translateX(296px)}}

  .ticker{position:absolute;left:0;right:0;bottom:0;z-index:5;height:54px;background:#F4F0E8;overflow:hidden;display:flex;align-items:center;border-top:3px solid #0c0b0a}
  .tk{display:flex;white-space:nowrap;animation:scroll 24s linear infinite}
  .tk span{font-family:"Space Mono",monospace;font-weight:700;font-size:17px;letter-spacing:2px;color:#2a2014;padding:0 22px}
  .tk span b{color:#E8743A}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
